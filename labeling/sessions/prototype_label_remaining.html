function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nextUnlabelled(){return rows.findIndex(r=>!labels[r.window_id])}
function renderList(){const pending=rows.map((r,i)=>({r,i})).filter(x=>!labels[x.r.window_id]);document.getElementById('list').innerHTML=pending.map(x=>{const r=x.r,i=x.i;return `<div class="item ${i===active?'active':''}" onclick="select(${i})"><b>${esc(r.window_id)}</b><br>SID ${r.solution_id} | event ${r.event_index}<br>${esc(r.window_end_time)}</div>`}).join('');document.getElementById('count').textContent=` 已完成 ${Object.keys(labels).length}/${rows.length}，待标注 ${pending.length}`}
function select(i){if(i<0){document.getElementById('detail').innerHTML='<h2>全部完成</h2><p class="hint">所有剩余窗口都已标注。点击顶部按钮导出 prototype_labels_remaining.csv。</p>';renderList();return}active=i;const r=rows[i];const label=labels[r.window_id]?.label??'';document.getElementById('detail').innerHTML=`<h2>${esc(r.window_id)}</h2><div class="muted">solution_id=${r.solution_id} | event_index=${r.event_index} | window_end_time=${esc(r.window_end_time)} | problem=${esc(r.problem_id)} | judge=${esc(r.judge)}</div><p><button class="btn yes" onclick="mark(1)">1 该弹</button><button class="btn no" onclick="mark(0)">0 不该弹</button><button class="btn skip" onclick="mark(-1)">-1 跳过</button> 当前：${label}</p><p class="hint"><b>AI参考（仅供判断，不会自动写入你的标签）</b><br>AI标签：${r.ai_label===1?'1 该弹':r.ai_label===0?'0 不该弹':'-1 跳过/不确定'}${r.ai_reason?`<br>AI理由：${esc(r.ai_reason)}`:''}</p><h3>窗口特征</h3><p class="hint">每张卡片表示“窗口结束前向回看”的时间范围。例如 5s = 结束时间前 5 秒到结束时间这一段。keys 是全部按键数；文本键数排除了 Control/Shift 等修饰键；剪贴板操作是检测到 Control/Meta 与 C/V 的组合；pause 是停顿次数（相邻按键间隔至少 2 秒）；BS/Enter/Control 是对应按键次数；rowΔ/colΔ 是编辑器行号/列号变化次数。</p><div class="cards">${['5','10','30','60','120'].map(w=>`<div class="card"><b>向前 ${w} 秒</b><br>活动类型=${esc(r['activity_type_'+w+'s'])}<br>按键数=${r['keys_'+w+'s']}<br>文本键=${r['text_keys_'+w+'s']}<br>修饰键=${r['modifier_keys_'+w+'s']}<br>剪贴板操作=${r['clipboard_ops_'+w+'s']}<br>停顿=${r['pause_count_'+w+'s']} 次<br>退格=${r['backspace_'+w+'s']}<br>Enter=${r['enter_'+w+'s']}<br>Control=${r['control_'+w+'s']}<br>行变化=${r['row_changes_'+w+'s']}<br>列变化=${r['column_changes_'+w+'s']}</div>`).join('')}</div><h3>按键摘要</h3><div class="summary">${esc(r.key_summary)}</div><h3>代码回放（触发点之前，近似重建）</h3><p class="hint">这是根据按键和光标行列位置重建的参考文本，不等同于最终提交源码；若记录缺失或编辑器发生复杂操作，文本可能不完整。</p><pre class="code">${esc(r.code_replay)}</pre><h3>提交代码</h3><pre class="code">${esc(r.submitted_code||'未找到本地提交代码')}</pre>`;renderList()}
function mark(v){const r=rows[active];labels[r.window_id]={window_id:r.window_id,solution_id:r.solution_id,event_index:r.event_index,window_end_time:r.window_end_time,label:v};localStorage.setItem('prototype_labels_remaining',JSON.stringify(labels));const next=nextUnlabelled();renderList();select(next)}
function downloadCsv(){const cols=['window_id','solution_id','event_index','window_end_time','label'];const lines=[cols.join(',')];rows.forEach(r=>{if(labels[r.window_id])lines.push(cols.map(c=>JSON.stringify(labels[r.window_id][c]??'')).join(','))});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='prototype_labels_remaining.csv';a.click()}
