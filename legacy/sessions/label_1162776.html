var labels = JSON.parse(localStorage.getItem("labels_1162776") || "[]");
var active = -1;
var nBursts = 0;
for (var i = 0; i < segs.length; i++) { if (segs[i].type === "burst") nBursts++; }

function renderTL() {
  var h = "";
  for (var i = 0; i < segs.length; i++) {
    var s = segs[i];
    if (s.type === "gap") { h += "<div class=gap>" + s.label + "</div>"; continue; }
    var cls = "seg"; if (i === active) cls += " marked";
    for (var j = 0; j < labels.length; j++) { if (labels[j].seg === i) { cls += " marked"; break; } }
    var title = s.start + "-" + s.end + " | " + s.keys + " keys | BS=" + s.bs + "(" + s.bs_pct + ")";
    h += "<div class=\"" + cls + "\" style=\"width:" + s.width + "px;height:" + s.height + "px;background:" + s.color + "\" title=\"" + title + "\" onclick=\"clickSeg(" + i + ")\"></div>";
  }
  document.getElementById("tl").innerHTML = h;
}

function clickSeg(i) {
  if (segs[i].type === "gap") return;
  active = i; renderTL();
  var s = segs[i];
  document.getElementById("info").textContent = "[" + s.start + "-" + s.end + "] " + s.keys + "keys BS=" + s.bs + "(" + s.bs_pct + ") Enter=" + s.enter + " Ctrl=" + s.ctrl;
  document.getElementById("detail").textContent = "Keys: " + s.seq;
}

function mark(v) {
  if (active < 0) { alert("Click a bar first!"); return; }
  var s = segs[active];
  labels.push({seg: active, time: s.start + "-" + s.end, label: v, keys: s.keys, bs: s.bs, bs_pct: s.bs_pct});
  localStorage.setItem("labels_1162776", JSON.stringify(labels));
  document.getElementById("lc").textContent = labels.length;
  document.getElementById("info").textContent = "Marked [" + s.start + "-" + s.end + "] as " + (v===1?"YES":v===0?"NO":"SKIP") + " | " + labels.length + " total";
  active = -1; renderTL();
}

document.onkeydown = function(e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "y" || e.key === "Y") mark(1);
  if (e.key === "n" || e.key === "N") mark(0);
  if (e.key === "s" || e.key === "S") mark(-1);
};

function saveLabels() {
  var b = new Blob([JSON.stringify(labels, null, 2)], {type: "application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = "labels_1162776.json"; a.click();
}

document.getElementById("code").textContent = "#include<stdio.h>\n#include<string.h>\n#include<stdlib.h>\n#include<limits.h>\n\ntypedef struct{\n    int t;\n    int w;\n}player;\ntypedef struct{\n    int e;\n    int hurt;\n}Monster;\n\nint enemy(int m);\n{\n    int max=0,s[32],t=0;\n    while(m!=0)\n    {\n        s[t]=m%2;\n        m/=2;\n        t++;\n    }\n    int j=0;\n    for(int i=0;i<t;i++)\n    {\n        if(s[i]==1)j++;\n        else\n        {\n            if(max<j)max=j;\n            j=0;\n        }\n    }\n    return max;\n}\nint battle(player *p,Monster *en)\n{\n    en->hurt+=p->w;\n    if(en->hurt>=en->e)\n    {\n        p->w+=en->e;\n        //*e的变化\n        en->e=INT_MAX/2;\n        return 1;\n    }\n    else\n    {\n        p->t--;\n        en->hurt+=p->w;\n        return 0;\n    }\n}\nint position(const int k,int i,const int n)\n{\n    i=i+k;\n    if(i>=n)i%=n;\n    return i;\n}\n\nint cmp(const void *p1,const void *p2)\n{\n    Monster *a=(Monster *)p1;\n    Monster *b=(Monster *)p2;\n    return (a->e)-(b->e);\n}\n\nint main()\n{\n    player players;\n    int n,m;\n    while(scanf(\"%d%d%d%d\",&n,&players.t,&players.w,&m)!=EOF)\n    {\n        //读入\n        int *monster=(Monster *)malloc(sizeof(Monster)*n);\n        for(int i=0;i<n;i++)\n        {\n            scanf(\"%d\",&monster[i].e);\n            monster[i].hurt=0;\n        }\n        \n        int rest,k=enemy(m),p=0;//剩余怪兽数 rest；\n        int i=0;//死亡怪兽数 i;\n        while(i!=n)\n        {\n            p=(k,p,n-i);\n            if(battle(&players,&monster[p]))\n            {\n                qsort(monster,n-i,sizeof(Monster),cmp);\n                i++;\n            }\n            if(players.t==0)break;\n        }\n        rest=n-i;\n        if(rest==0)printf(\"Yes %d\",players.t);\n        else printf(\"No %d\",rest);\n    }\n    return 0;\n}";
