let labels=JSON.parse(localStorage.getItem('labels_1162776')||'[]');
function show(i){
  i=Math.max(0,Math.min(snaps.length-1,i));
  document.getElementById('slider').value=i;
  document.getElementById('code').textContent=snaps[i].c;
  document.getElementById('info').textContent='Snapshot '+i+'/'+snaps.length+' | labels: '+labels.length;
}
document.getElementById('slider').oninput=function(){show(+this.value)};
document.onkeydown=function(e){
  if(e.target.tagName=='INPUT')return;
  if(e.key=='ArrowRight')show(+document.getElementById('slider').value+5);
  if(e.key=='ArrowLeft')show(+document.getElementById('slider').value-5);
  if(e.key=='y'||e.key=='Y')mark(1);
  if(e.key=='n'||e.key=='N')mark(0);
};
function mark(v){
  const i=+document.getElementById('slider').value;
  labels.push({idx:i,label:v,code:snaps[i].c.substring(0,200)});
  localStorage.setItem('labels_1162776',JSON.stringify(labels));
  document.getElementById('info').textContent='Snapshot '+i+'/'+snaps.length+' | labels: '+labels.length+' (last: '+(v==1?'YES':v==0?'NO':'SKIP')+')';
  show(i+1);
}
function saveLabels(){
  const b=new Blob([JSON.stringify(labels,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='labels_1162776.json';a.click();
}
show(0);
</script>
<button onclick=saveLabels() style='margin:4px 16px;padding:4px 12px;background:#007acc;color:#fff;border:none;border-radius:3px;cursor:pointer'>Download Labels JSON</button>
